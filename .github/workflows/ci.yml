name: CI

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app deps
        run: npm ci

      # Antes de los tests, no después: vitest también corre los tests de
      # functions/src (la lógica fiscal de ARCA vive del lado servidor), y esos
      # importan dependencias que solo están en functions/node_modules.
      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Lint (src)
        run: npm run lint

      - name: Tests unitarios (vitest) con cobertura
        run: npm run test:coverage

      - name: Typecheck (functions)
        run: npm run typecheck:functions

      - name: Lint (functions)
        run: npm run lint:functions

      # functions/lib está commiteado y el deploy no compila (ver CLAUDE.md):
      # si src cambió y lib no, el próximo deploy subiría JS viejo.
      - name: functions/lib al día con functions/src
        run: |
          npm --prefix functions run build
          git diff --exit-code --stat -- functions/lib || (echo "functions/lib no coincide con functions/src: corré npm --prefix functions run build y commiteá lib/" && exit 1)

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      # El emulador de Firestore necesita Java; firebase-tools exige JDK 21+
      # y el default del runner ubuntu es más viejo.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests de reglas Firestore (emulador)
        run: npm run test:rules

  # Login por rol de punta a punta (auditoría 2026-09-22: los tests existían y
  # nunca corrían). El dev server apunta solo a los emuladores, así que las
  # claves de Firebase son de relleno.
  e2e:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: rolito-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: rolito-app
      VITE_FIREBASE_STORAGE_BUCKET: rolito-app.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
      VITE_FIREBASE_APP_ID: 1:0:web:demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (emuladores + seed + Playwright)
        run: npx --yes firebase-tools emulators:exec --only auth,firestore --project rolito-app "npm run seed:emulator && npx playwright test"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
