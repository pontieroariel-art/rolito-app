name: CI

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app deps
        run: npm ci

      # Antes de los tests, no después: vitest también corre los tests de
      # functions/src (la lógica fiscal de ARCA vive del lado servidor), y esos
      # importan dependencias que solo están en functions/node_modules.
      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Lint (src)
        run: npm run lint

      - name: Tests unitarios (vitest)
        run: npm run test:unit

      - name: Typecheck (functions)
        run: npm run typecheck:functions

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      # El emulador de Firestore necesita Java; firebase-tools exige JDK 21+
      # y el default del runner ubuntu es más viejo.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests de reglas Firestore (emulador)
        run: npm run test:rules
