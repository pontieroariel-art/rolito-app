name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vitest también corre los tests de functions/src (la lógica fiscal de
      # ARCA vive del lado servidor) y esos importan dependencias que solo
      # están en functions/node_modules.
      - name: Install functions deps
        run: npm ci
        working-directory: functions

      # Gatea el deploy: vite build NO typechea, así que un error de tipos
      # llegaría a producción si no lo cortamos acá.
      - name: Typecheck
        run: npm run typecheck

      # Lint y tests unitarios también cortan el deploy. Antes solo los corría
      # el workflow CI, que es independiente: el 14/09 el hosting se subió tres
      # veces con el CI en rojo (un test dependía del huso horario).
      - name: Lint
        run: npm run lint

      - name: Tests unitarios (vitest)
        run: npm run test:unit

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:              ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:          ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:           ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:       ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID:  ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:               ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY:           ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VAPID_PUBLIC_KEY:              ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_RECAPTCHA_SITE_KEY:            ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN:                    ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      # Archivos de las versiones anteriores (2026-09-25, "Failed to fetch
      # dynamically imported module"): cada deploy reemplaza todo el hosting y
      # una pestaña abierta con la versión vieja pide chunks que ya no existen.
      # Se guardan los assets de cada build en la caché de Actions y se suman
      # al deploy los que falten, mientras tengan menos de 14 días. Los nuevos
      # nunca se pisan (cp -n) y el precache del SW no los ve (van después del build).
      - name: Restaurar assets de deploys anteriores
        uses: actions/cache/restore@v4
        with:
          path: assets-anteriores
          key: hosting-assets-${{ github.sha }}
          restore-keys: hosting-assets-

      - name: Sumar assets anteriores al deploy
        run: |
          mkdir -p assets-anteriores
          find assets-anteriores -type f -mtime +14 -delete
          cp -n -p assets-anteriores/* dist/assets/ 2>/dev/null || true
          cp -n -p dist/assets/* assets-anteriores/
          echo "assets en el deploy: $(ls dist/assets | wc -l) · guardados: $(ls assets-anteriores | wc -l)"

      - name: Guardar assets para el próximo deploy
        uses: actions/cache/save@v4
        with:
          path: assets-anteriores
          key: hosting-assets-${{ github.sha }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --project rolito-app --non-interactive
